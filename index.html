<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sky & Carnival Typing Master</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* =========================================
       RESET & BASE STYLES
       ========================================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      background: #060919;
      color: #ffffff;
    }

    .app-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      background: radial-gradient(circle at center, #1e1b4b 0%, #090d29 100%);
    }

    /* =========================================
       1. SELECTION & MENU SCREEN (ENHANCED)
       ========================================= */
    .screen-overlay {
      position: absolute;
      inset: 0;
      background: rgba(6, 9, 24, 0.94);
      backdrop-filter: blur(14px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .screen-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .stage-frame {
      width: 94vw;
      max-width: 1150px;
      background: linear-gradient(145deg, rgba(30, 41, 89, 0.95), rgba(15, 23, 52, 0.98));
      border: 4px solid #ff0055;
      border-radius: 36px;
      box-shadow: 0 0 50px rgba(255, 0, 85, 0.4), inset 0 0 30px rgba(0, 0, 0, 0.8);
      padding: 36px 48px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .stage-header {
      text-align: center;
    }

    .stage-header h1 {
      font-family: 'Fredoka', cursive;
      font-size: 3.8rem;
      background: linear-gradient(135deg, #ffcc00, #ff0055);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 25px rgba(255, 0, 85, 0.4);
    }

    .stage-header .subtitle {
      font-size: 1.4rem;
      color: #a5b4fc;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 700;
      margin-top: 4px;
    }

    .options-body {
      display: grid;
      grid-template-columns: 1fr 220px 1fr;
      gap: 28px;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 28px;
      padding: 32px;
      border: 1.5px solid rgba(255, 255, 255, 0.1);
    }

    .option-column h3 {
      font-family: 'Fredoka', cursive;
      font-size: 1.8rem;
      color: #00f2fe;
      margin-bottom: 16px;
      text-align: center;
      letter-spacing: 1px;
    }

    .selector-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .select-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 2px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      padding: 14px 22px;
      border-radius: 16px;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.25s ease;
    }

    .select-btn .arrow {
      opacity: 0;
      color: #ffcc00;
      transition: transform 0.2s, opacity 0.2s;
    }

    .select-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
      color: #fff;
      transform: translateX(4px);
    }

    .select-btn.active {
      background: linear-gradient(135deg, rgba(255, 204, 0, 0.2), rgba(255, 0, 85, 0.2));
      border-color: #ffcc00;
      color: #ffcc00;
      box-shadow: 0 0 15px rgba(255, 204, 0, 0.3);
    }

    .select-btn.active .arrow {
      opacity: 1;
      transform: translateX(6px);
    }

    .play-center {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .play-badge {
      background: rgba(255, 0, 85, 0.15);
      padding: 20px;
      border-radius: 36px;
      border: 3px dashed #ff0055;
    }

    .big-play-btn {
      padding: 22px 46px;
      font-family: 'Fredoka', cursive;
      font-size: 2.2rem;
      border: none;
      border-radius: 60px;
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      color: #060919;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(0, 242, 254, 0.5);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .big-play-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 16px 40px rgba(0, 242, 254, 0.8);
    }

    /* =========================================
       2. GAME PLAYING SCREEN & TRACKS
       ========================================= */
    .game-screen {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      height: 110px;
      padding: 0 40px;
      background: rgba(10, 15, 35, 0.85);
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.06);
      padding: 10px 32px;
      border-radius: 20px;
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 160px;
    }

    .stat-title {
      font-size: 0.85rem;
      letter-spacing: 2px;
      color: #94a3b8;
      font-weight: 700;
    }

    .stat-num {
      font-family: 'Fredoka', cursive;
      font-size: 2.2rem;
      color: #00f2fe;
    }

    /* Flying Track Rows */
    .fly-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      position: relative;
      overflow: hidden;
      padding: 30px 0;
      background: linear-gradient(180deg, rgba(20, 30, 60, 0.4) 0%, rgba(10, 15, 30, 0.7) 100%);
    }

    .track-row {
      position: relative;
      width: 100%;
      height: 30%;
      display: flex;
      align-items: center;
    }

    .shelf-line {
      position: absolute;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, transparent, rgba(0, 242, 254, 0.25), transparent);
    }

    /* BIGGER & VIBRANT TARGET CARDS */
    .target-card {
      position: absolute;
      left: -350px;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 16px 32px;
      border-radius: 50px;
      background: rgba(15, 23, 42, 0.92);
      border: 3.5px solid #00f2fe;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 242, 254, 0.4);
      user-select: none;
      white-space: nowrap;
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    .target-avatar {
      font-size: 3.6rem;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5));
      animation: floatBounce 0.6s infinite alternate ease-in-out;
    }

    @keyframes floatBounce {
      from { transform: translateY(-6px); }
      to { transform: translateY(6px); }
    }

    .target-word {
      font-family: 'Fredoka', cursive;
      font-size: 2.5rem;
      letter-spacing: 3px;
    }

    /* REAL-TIME SPELLING HIGHLIGHT */
    .char-typed {
      color: #00ffff;
      text-shadow: 0 0 12px #00ffff;
    }

    .char-untyped {
      color: #ffffff;
    }

    /* Theme Card Variations */
    .target-card.duck { border-color: #ffcc00; box-shadow: 0 0 20px rgba(255, 204, 0, 0.5); }
    .target-card.owl { border-color: #c084fc; box-shadow: 0 0 20px rgba(192, 132, 252, 0.5); }
    .target-card.panda { border-color: #38bdf8; box-shadow: 0 0 20px rgba(56, 189, 248, 0.5); }
    .target-card.parrot { border-color: #4ade80; box-shadow: 0 0 20px rgba(74, 222, 128, 0.5); }
    .target-card.flamingo { border-color: #f472b6; box-shadow: 0 0 20px rgba(244, 114, 182, 0.5); }
    .target-card.tiger { border-color: #fb923c; box-shadow: 0 0 20px rgba(251, 146, 60, 0.5); }
    .target-card.dragon { border-color: #f43f5e; box-shadow: 0 0 20px rgba(244, 63, 94, 0.5); }

    .target-card.popped {
      transform: scale(1.35);
      opacity: 0;
    }

    /* Bottom Control Panel */
    .bottom-control {
      height: 110px;
      padding: 0 40px;
      background: rgba(10, 15, 35, 0.95);
      border-top: 2px solid rgba(255, 255, 255, 0.1);
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .input-box-holder {
      flex: 1;
    }

    #typingInput {
      width: 100%;
      padding: 18px 36px;
      font-size: 1.7rem;
      border-radius: 60px;
      border: 3px solid rgba(0, 242, 254, 0.5);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      outline: none;
      transition: all 0.25s ease;
      font-weight: 600;
    }

    #typingInput:focus {
      border-color: #00f2fe;
      box-shadow: 0 0 30px rgba(0, 242, 254, 0.6);
      background: rgba(255, 255, 255, 0.15);
    }

    .action-btn {
      padding: 16px 36px;
      border-radius: 60px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: #fff;
    }

    /* =========================================
       3. GAME OVER RESULT MODAL (ENHANCED)
       ========================================= */
    .result-card {
      background: linear-gradient(145deg, #0f172a, #1e1b4b);
      border: 4px solid #00f2fe;
      border-radius: 36px;
      padding: 44px 50px;
      width: 94%;
      max-width: 650px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0,0,0,0.9), 0 0 40px rgba(0, 242, 254, 0.3);
    }

    .result-card h2 {
      font-family: 'Fredoka', cursive;
      font-size: 3.2rem;
      color: #ffcc00;
      margin-bottom: 8px;
    }

    .res-sub {
      color: #94a3b8;
      font-size: 1.2rem;
      margin-bottom: 32px;
      font-weight: 600;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 36px;
    }

    .m-box {
      background: rgba(255, 255, 255, 0.05);
      padding: 22px;
      border-radius: 24px;
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
    }

    .m-val {
      font-family: 'Fredoka', cursive;
      font-size: 2.6rem;
      color: #00f2fe;
    }

    .m-lbl {
      font-size: 0.9rem;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .btn-group {
      display: flex;
      gap: 16px;
      justify-content: center;
    }

    .big-play-btn.inline {
      padding: 16px 36px;
      font-size: 1.3rem;
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- 1. SELECTION / START MENU SCREEN -->
    <div id="startScreen" class="screen-overlay active">
      <div class="stage-frame">
        <div class="stage-header">
          <h1>🎪 Typing Target Toss</h1>
          <p class="subtitle">Game Options</p>
        </div>

        <div class="options-body">
          <!-- Difficulty Selection Column -->
          <div class="option-column">
            <h3>Difficulty</h3>
            <div class="selector-list" id="difficultyList">
              <button class="select-btn active" data-diff="easy">
                <span class="arrow">➔</span> Easy
              </button>
              <button class="select-btn" data-diff="medium">
                <span class="arrow">➔</span> Medium
              </button>
              <button class="select-btn" data-diff="hard">
                <span class="arrow">➔</span> Hard
              </button>
            </div>
          </div>

          <!-- Play Button Center Banner -->
          <div class="play-center">
            <div class="play-badge">
              <button id="playBtn" class="
