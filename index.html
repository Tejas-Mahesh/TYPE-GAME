<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sky & Carnival Typing Master</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-container">

    <!-- 1. SELECTION / START MENU SCREEN -->
    <div id="startScreen" class="screen-overlay active">
      <div class="stage-frame">
        <div class="stage-header">
          <h1>🎪 Typing Target Toss</h1>
          <p class="subtitle">Game Options</p>
        </div>

        <div class="options-body">
          <!-- Difficulty Selection Column -->
          <div class="option-column">
            <h3>Difficulty</h3>
            <div class="selector-list" id="difficultyList">
              <button class="select-btn active" data-diff="easy">
                <span class="arrow">➔</span> Easy
              </button>
              <button class="select-btn" data-diff="medium">
                <span class="arrow">➔</span> Medium
              </button>
              <button class="select-btn" data-diff="hard">
                <span class="arrow">➔</span> Hard
              </button>
            </div>
          </div>

          <!-- Play Button Center Banner -->
          <div class="play-center">
            <div class="play-badge">
              <button id="playBtn" class="big-play-btn">Play ▶</button>
            </div>
          </div>

          <!-- Lesson / Word Type Selection Column -->
          <div class="option-column">
            <h3>Lesson Type</h3>
            <div class="selector-list" id="lessonList">
              <button class="select-btn active" data-lesson="all">
                <span class="arrow">➔</span> All English Words
              </button>
              <button class="select-btn" data-lesson="easy">
                <span class="arrow">➔</span> Easy Words
              </button>
              <button class="select-btn" data-lesson="hard">
                <span class="arrow">➔</span> Hard Words
              </button>
              <button class="select-btn" data-lesson="home">
                <span class="arrow">➔</span> Home Row Keys
              </button>
              <button class="select-btn" data-lesson="top">
                <span class="arrow">➔</span> Top Row Keys
              </button>
              <button class="select-btn" data-lesson="bottom">
                <span class="arrow">➔</span> Bottom Row Keys
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 2. GAME PLAYING SCREEN -->
    <div id="gameScreen" class="game-screen">
      <!-- Top Scoreboard Bar -->
      <header class="top-bar">
        <div class="stat-card">
          <span class="stat-title">SCORE</span>
          <span id="scoreVal" class="stat-num">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-title">TIME</span>
          <span id="timeVal" class="stat-num">60s</span>
        </div>
        <div class="stat-card">
          <span class="stat-title">WPM</span>
          <span id="wpmVal" class="stat-num">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-title">ACCURACY</span>
          <span id="accuracyVal" class="stat-num">100%</span>
        </div>
      </header>

      <!-- 3 Flying Track Rows -->
      <main class="fly-stage" id="flyStage">
        <div class="track-row" id="track-0">
          <div class="shelf-line"></div>
        </div>
        <div class="track-row" id="track-1">
          <div class="shelf-line"></div>
        </div>
        <div class="track-row" id="track-2">
          <div class="shelf-line"></div>
        </div>
      </main>

      <!-- Bottom Typing Input Field -->
      <footer class="bottom-control">
        <div class="input-box-holder">
          <input 
            type="text" 
            id="typingInput" 
            placeholder="Type the matching word on screen..." 
            autocomplete="off" 
            autofocus
          />
        </div>
        <button id="exitGameBtn" class="action-btn">Menu</button>
      </footer>
    </div>

    <!-- 3. GAME OVER MODAL -->
    <div id="endModal" class="screen-overlay">
      <div class="result-card">
        <h2>🎉 Flight Completed!</h2>
        <p class="res-sub">Here is your performance summary:</p>

        <div class="metrics-grid">
          <div class="m-box">
            <span class="m-val" id="finalScore">0</span>
            <span class="m-lbl">Total Score</span>
          </div>
          <div class="m-box">
            <span class="m-val" id="finalWpm">0</span>
            <span class="m-lbl">WPM</span>
          </div>
          <div class="m-box">
            <span class="m-val" id="finalAccuracy">100%</span>
            <span class="m-lbl">Accuracy</span>
          </div>
          <div class="m-box">
            <span class="m-val" id="finalHits">0</span>
            <span class="m-lbl">Targets Popped</span>
          </div>
        </div>

        <div class="btn-group">
          <button id="playAgainBtn" class="big-play-btn inline">Play Again</button>
          <button id="changeOptionsBtn" class="action-btn">Change Options</button>
        </div>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
